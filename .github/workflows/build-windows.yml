name: build-windows

# Freezes the Image Toolkit app into an .exe (PyInstaller) and compiles a signed
# Inno Setup installer. Artifacts are downloaded and Authenticode-signed off-CI.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build ImageToolkit.exe
        run: >
          pyinstaller --onefile --windowed --name ImageToolkit
          --icon image-toolkit.ico
          --version-file packaging/version.txt
          --add-data "image-toolkit.ico;."
          --collect-all cv2
          --collect-all skimage
          --collect-all rawpy
          --collect-all PIL
          --collect-submodules numpy
          --collect-submodules piexif
          image_toolkit_app.py
      - name: Stage installer inputs
        shell: pwsh
        run: |
          $stage = "packaging/staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/ImageToolkit.exe $stage/
          Copy-Item quickopen-root.crt, README.md, LICENSE $stage/ -ErrorAction SilentlyContinue
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-toolkit-windows
          path: |
            dist/ImageToolkit.exe
            packaging/dist/ImageToolkit-Setup.exe
          if-no-files-found: error
